# Local development profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:arthurford;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:3000,http://192.168.*:*
