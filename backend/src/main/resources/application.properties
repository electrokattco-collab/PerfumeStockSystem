# Application Configuration
spring.application.name=perfume-stock-backend
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perfumestock}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
# IMPORTANT: In production, JWT_SECRET must be set via environment variable
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-min32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.perfumestock=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true


# Rate Limiting
app.rate-limit.max-requests=${RATE_LIMIT_MAX:100}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}

# File Upload
app.upload-dir=${UPLOAD_DIR:uploads/products}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
