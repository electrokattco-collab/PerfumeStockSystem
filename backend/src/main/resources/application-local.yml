# Local Development Configuration
spring:
  application:
    name: perfume-stock-backend
  datasource:
    url: jdbc:h2:mem:perfumestock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-minimum-32-characters-long}
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000

logging:
  level:
    org.springframework.security: INFO
    com.perfumestock: DEBUG
