# Local Development - H2 File-Based Database (Persistent)
spring.datasource.url=jdbc:h2:file:./data/perfumestock;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway (Hibernate manages schema in local dev)
spring.flyway.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=localdevsecretkeymin32characterslong!
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.perfumestock=DEBUG

# Rate Limiting
app.rate-limit.max-requests=100
app.rate-limit.window-seconds=60

# File Upload
app.upload-dir=uploads/products

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
