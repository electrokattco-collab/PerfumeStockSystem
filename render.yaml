services:
  # Backend Web Service
  - type: web
    name: perfume-stock-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ORIGINS
        value: https://perfume-stock-frontend.onrender.com

  # Frontend Static Site
  - type: static
    name: perfume-stock-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://perfume-stock-backend.onrender.com
