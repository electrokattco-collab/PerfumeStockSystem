services:
  # PostgreSQL Database
  - type: pserv
    name: perfume-stock-db
    env: docker
    image:
      url: postgres:16-alpine
    envVars:
      - key: POSTGRES_DB
        value: perfumestock
      - key: POSTGRES_USER
        value: perfumestock
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Backend Web Service
  - type: web
    name: perfume-stock-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: perfume-stock-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: perfumestock
      - key: DB_USER
        value: perfumestock
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: perfume-stock-db
          property: envVar
          envVarKey: POSTGRES_PASSWORD
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ORIGINS
        value: https://perfume-stock-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: perfume-stock-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://perfume-stock-backend.onrender.com/api
